<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vision</title>
  <style>
    /* A double click would otherwise select text, and dragging a selection starts a native drag. */
    body { margin: 0; height: 3000px; user-select: none; }
    #pad { position: absolute; left: 0; top: 0; width: 400px; height: 300px; background: #eee; }
  </style>
</head>
<body>
  <div id="pad"></div>
  <p role="status" id="out" style="position: fixed; left: 0; top: 320px">Nothing yet</p>
  <script>
    const out = document.getElementById('out')
    const pad = document.getElementById('pad')
    const log = []
    const record = (entry) => {
      log.push(entry)
      out.textContent = log.slice(-3).join('; ')
    }
    pad.addEventListener('mousemove', (e) => {
      if (e.buttons === 0) out.textContent = `over ${e.clientX},${e.clientY}`
    })
    pad.addEventListener('mousedown', (e) => record(`down ${e.clientX},${e.clientY}`))
    pad.addEventListener('mouseup', (e) => record(`up ${e.clientX},${e.clientY}`))
    pad.addEventListener('click', (e) => record(`click ${e.button} ${e.clientX},${e.clientY}`))
    pad.addEventListener('dblclick', (e) => record(`dblclick ${e.clientX},${e.clientY}`))
  </script>
</body>
</html>
