name: CI

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read
  # The nightly selenium-webdriver comes from GitHub Packages.
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Java runs the Selenium Grid that the selenium_grid_* tools are tested against.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The latest release, so the tests follow the Grid people are most likely to run.
      - name: Download Selenium Grid
        run: |
          gh release download --repo SeleniumHQ/selenium --pattern 'selenium-server-[0-9]*.jar' \
            --output "$RUNNER_TEMP/selenium-server.jar"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install
        run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Browser tests (Chrome, and Selenium Grid)
        run: npm run test:e2e
        env:
          SELENIUM_MCP_TEST_SERVER_JAR: ${{ runner.temp }}/selenium-server.jar
          SELENIUM_MCP_TEST_NODE_ARGS: --selenium-manager true
